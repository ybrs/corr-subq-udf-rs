[package]
name = "df_subquery_udf"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
datafusion = { version = "54.0.0", default-features = false, features = ["avro", "parquet", "sql"] }
arrow      = "58.3.0"
sqlparser  = "0.62.0"
tokio      = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
futures    = "0.3"
